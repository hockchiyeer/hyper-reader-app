<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HyperReader | 开放链接阅读工作台</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f7f4ee;
      --paper: #fffdf7;
      --panel: #f0eee7;
      --ink: #242321;
      --muted: #6a665f;
      --soft: #8e877e;
      --line: #d8d1c4;
      --line-strong: #b8afa0;
      --green: #21745c;
      --green-soft: #dcebe4;
      --blue: #245e8f;
      --blue-soft: #dce8f2;
      --rust: #a85632;
      --rust-soft: #f0e1d8;
      --violet: #6f527f;
      --violet-soft: #eadfed;
      --gold: #a77a22;
      --danger: #b64848;
      --shadow: 0 18px 40px rgba(49, 43, 34, 0.12);
      --radius: 8px;
      --sidebar: 248px;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(90deg, rgba(36, 94, 143, 0.07) 1px, transparent 1px),
        linear-gradient(180deg, rgba(168, 86, 50, 0.05) 1px, transparent 1px),
        var(--bg);
      background-size: 42px 42px;
      color: var(--ink);
      font-family: ui-serif, Georgia, "Songti SC", "Noto Serif CJK SC", serif;
      font-size: 15px;
      line-height: 1.55;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      color: inherit;
    }

    a {
      color: var(--blue);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: var(--sidebar) minmax(0, 1fr);
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 18px 14px;
      background: rgba(255, 253, 247, 0.88);
      border-right: 1px solid var(--line);
      backdrop-filter: blur(18px);
      overflow-y: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      padding: 4px 4px 14px;
      border-bottom: 1px solid var(--line);
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--ink);
      color: var(--paper);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
    }

    .brand-title {
      display: grid;
      gap: 1px;
    }

    .brand-title strong {
      font-size: 18px;
      line-height: 1.1;
    }

    .brand-title span {
      color: var(--muted);
      font-size: 12px;
      font-family: ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif;
    }

    .nav-block {
      display: grid;
      gap: 5px;
    }

    .nav-label {
      padding: 0 8px 3px;
      color: var(--soft);
      font-size: 11px;
      font-family: ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif;
      font-weight: 700;
      letter-spacing: 0;
    }

    .nav-item {
      width: 100%;
      min-height: 40px;
      display: grid;
      grid-template-columns: 22px 1fr auto;
      align-items: center;
      gap: 8px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      padding: 8px 9px;
      text-align: left;
      cursor: pointer;
      color: var(--muted);
      font-family: ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif;
      font-size: 14px;
    }

    .nav-item:hover {
      border-color: var(--line);
      background: rgba(255, 255, 255, 0.62);
      color: var(--ink);
    }

    .nav-item.active {
      background: var(--ink);
      color: var(--paper);
      border-color: var(--ink);
    }

    .count {
      min-width: 24px;
      height: 22px;
      display: inline-grid;
      place-items: center;
      border-radius: 99px;
      background: rgba(36, 35, 33, 0.08);
      color: inherit;
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .nav-item.active .count {
      background: rgba(255, 255, 255, 0.15);
    }

    .source-strip {
      display: grid;
      gap: 8px;
      padding: 10px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 253, 247, 0.62);
    }

    .source-row {
      display: grid;
      grid-template-columns: 9px 1fr auto;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      font-family: ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--green);
    }

    .main {
      min-width: 0;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto auto;
      gap: 12px;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(247, 244, 238, 0.9);
      backdrop-filter: blur(18px);
    }

    .search {
      min-width: 0;
      position: relative;
    }

    .search i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--soft);
    }

    .search input {
      width: 100%;
      height: 42px;
      padding: 0 14px 0 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
      outline: none;
      font-family: ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif;
    }

    .search input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(36, 94, 143, 0.12);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .locale-select {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      padding: 0 9px;
      color: var(--muted);
      font-family: ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif;
      font-size: 13px;
    }

    .locale-select select {
      max-width: 150px;
      border: 0;
      background: transparent;
      color: var(--ink);
      outline: none;
      font: inherit;
    }

    .btn,
    .icon-btn,
    .chip {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
      cursor: pointer;
      font-family: ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .btn {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 12px;
      font-size: 14px;
    }

    .btn:hover,
    .icon-btn:hover,
    .chip:hover {
      border-color: var(--line-strong);
      transform: translateY(-1px);
    }

    .btn.primary {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--paper);
    }

    .btn.green {
      background: var(--green);
      border-color: var(--green);
      color: white;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      font-size: 18px;
    }

    .chip {
      min-height: 32px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .chip.on {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--paper);
    }

    .content {
      min-width: 0;
      padding: 18px 20px 28px;
    }

    .view {
      display: none;
      gap: 16px;
    }

    .view.active {
      display: grid;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .metric {
      min-height: 92px;
      display: grid;
      align-content: space-between;
      gap: 10px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 253, 247, 0.82);
      box-shadow: 0 8px 24px rgba(49, 43, 34, 0.06);
    }

    .metric span {
      color: var(--muted);
      font-size: 12px;
      font-family: ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif;
    }

    .metric strong {
      font-size: 28px;
      line-height: 1;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .split {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(310px, 0.7fr);
      gap: 14px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 253, 247, 0.92);
      box-shadow: 0 8px 24px rgba(49, 43, 34, 0.06);
      overflow: hidden;
    }

    .panel-head {
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(240, 238, 231, 0.62);
    }

    .panel-head h2,
    .panel-head h3 {
      margin: 0;
      font-size: 17px;
      line-height: 1.2;
    }

    .panel-head small {
      color: var(--muted);
      font-family: ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif;
    }

    .panel-body {
      padding: 14px;
    }

    .feed {
      display: grid;
      gap: 10px;
    }

    .article-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .article-card:hover {
      transform: translateY(-2px);
      border-color: var(--line-strong);
      box-shadow: var(--shadow);
    }

    .article-card.selected {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(33, 116, 92, 0.12);
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 12px;
      font-family: ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif;
    }

    .article-title {
      margin: 0 0 7px;
      font-size: 20px;
      line-height: 1.25;
    }

    .summary {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .tag-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 8px;
      border-radius: 99px;
      background: var(--panel);
      color: var(--muted);
      font-size: 12px;
      font-family: ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif;
    }

    .tag.blue {
      background: var(--blue-soft);
      color: var(--blue);
    }

    .tag.green {
      background: var(--green-soft);
      color: var(--green);
    }

    .tag.rust {
      background: var(--rust-soft);
      color: var(--rust);
    }

    .score-stack {
      width: 136px;
      display: grid;
      gap: 8px;
      align-content: center;
    }

    .mini-score {
      display: grid;
      gap: 4px;
    }

    .mini-score span {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-size: 11px;
      font-family: ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif;
    }

    .bar {
      height: 7px;
      border-radius: 99px;
      overflow: hidden;
      background: #e5ded2;
    }

    .bar b {
      display: block;
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: var(--green);
    }

    .reader-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 14px;
      align-items: start;
    }

    .reader-article {
      padding: 26px;
    }

    .reader-article h1 {
      margin: 0 0 12px;
      font-size: 34px;
      line-height: 1.14;
    }

    .reader-article p {
      margin: 0 0 16px;
      font-size: 17px;
      line-height: 1.82;
    }

    .reader-article .lead {
      color: var(--muted);
      font-size: 18px;
      border-left: 3px solid var(--green);
      padding-left: 14px;
      margin-bottom: 20px;
    }

    .side-stack {
      display: grid;
      gap: 12px;
    }

    .score-list {
      display: grid;
      gap: 11px;
    }

    .score-row {
      display: grid;
      gap: 5px;
    }

    .score-row label {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
      font-family: ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif;
    }

    .link-list {
      display: grid;
      gap: 8px;
    }

    .link-item {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr);
      gap: 8px;
      padding: 9px 0;
      border-bottom: 1px solid var(--line);
    }

    .link-item:last-child {
      border-bottom: 0;
    }

    .link-item strong {
      display: block;
      font-size: 13px;
      line-height: 1.25;
    }

    .link-item span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-family: ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .link-item i {
      color: var(--blue);
      margin-top: 1px;
    }

    .graph-shell {
      min-height: 560px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 12% 18%, rgba(33, 116, 92, 0.16), transparent 32%),
        radial-gradient(circle at 85% 25%, rgba(36, 94, 143, 0.13), transparent 34%),
        linear-gradient(180deg, rgba(255, 253, 247, 0.94), rgba(240, 238, 231, 0.88));
    }

    #linkCanvas {
      width: 100%;
      height: 560px;
      display: block;
    }

    .legend {
      position: absolute;
      right: 14px;
      bottom: 14px;
      display: grid;
      gap: 7px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 253, 247, 0.9);
      color: var(--muted);
      font-size: 12px;
      font-family: ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif;
    }

    .legend span {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .graph-tip {
      position: absolute;
      z-index: 5;
      max-width: 250px;
      display: none;
      padding: 10px 12px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: var(--shadow);
      pointer-events: none;
      font-size: 13px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field > span {
      color: var(--muted);
      font-size: 12px;
      font-family: ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif;
      font-weight: 700;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
      outline: none;
      padding: 10px 11px;
      font-family: ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif;
    }

    .field textarea {
      min-height: 126px;
      resize: vertical;
      line-height: 1.55;
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(36, 94, 143, 0.12);
    }

    .result-grid {
      display: grid;
      gap: 12px;
    }

    .diagnosis {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .diagnosis-cell {
      min-height: 96px;
      display: grid;
      align-content: space-between;
      gap: 8px;
      border-radius: 8px;
      padding: 12px;
      background: var(--panel);
    }

    .diagnosis-cell strong {
      font-size: 27px;
      line-height: 1;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .diagnosis-cell span {
      color: var(--muted);
      font-size: 12px;
      font-family: ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif;
    }

    .claim-list {
      display: grid;
      gap: 8px;
      counter-reset: claims;
    }

    .action-box {
      display: grid;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .action-box h3 {
      margin: 0;
      font-size: 16px;
    }

    .action-box small {
      color: var(--muted);
      font-family: ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif;
    }

    .claim {
      counter-increment: claims;
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: start;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
    }

    .claim::before {
      content: counter(claims);
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--ink);
      color: var(--paper);
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .claim p {
      margin: 0;
      color: var(--ink);
      font-size: 14px;
    }

    .claim em {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      font-style: normal;
      font-family: ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif;
    }

    .source-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .source-card {
      display: grid;
      gap: 9px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
    }

    .source-card header {
      display: grid;
      grid-template-columns: 10px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
    }

    .source-card h3 {
      margin: 0;
      font-size: 16px;
    }

    .source-card p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      font-family: ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif;
    }

    .toggle {
      position: relative;
      width: 46px;
      height: 26px;
      border: 1px solid var(--line);
      border-radius: 99px;
      background: var(--panel);
      cursor: pointer;
    }

    .toggle::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      left: 2px;
      top: 2px;
      border-radius: 50%;
      background: var(--soft);
      transition: transform 0.16s ease, background 0.16s ease;
    }

    .toggle.on::after {
      transform: translateX(20px);
      background: var(--green);
    }

    .trail-list {
      display: grid;
      gap: 10px;
    }

    .trail-step {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      gap: 11px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
    }

    .trail-step b {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--ink);
      color: var(--paper);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .trail-step h3 {
      margin: 0 0 4px;
      font-size: 16px;
    }

    .trail-step p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      font-family: ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif;
    }

    .empty {
      min-height: 180px;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--muted);
      text-align: center;
      font-family: ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      z-index: 100;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      max-width: min(460px, calc(100vw - 28px));
      padding: 10px 14px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      background: var(--ink);
      color: var(--paper);
      box-shadow: var(--shadow);
      font-family: ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif;
      font-size: 14px;
      pointer-events: none;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .mobile-menu {
      display: none;
    }

    @media (max-width: 1040px) {
      :root {
        --sidebar: 214px;
      }

      .metric-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .split,
      .reader-layout {
        grid-template-columns: 1fr;
      }

      .side-stack {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .source-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 760px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: fixed;
        z-index: 60;
        left: 0;
        top: 0;
        width: min(320px, 86vw);
        transform: translateX(-105%);
        transition: transform 0.2s ease;
        box-shadow: var(--shadow);
      }

      body.menu-open .sidebar {
        transform: translateX(0);
      }

      .mobile-menu {
        display: grid;
      }

      .topbar {
        grid-template-columns: auto minmax(0, 1fr);
      }

      .topbar > .toolbar {
        grid-column: 1 / -1;
      }

      .metric-grid,
      .diagnosis,
      .form-grid,
      .side-stack {
        grid-template-columns: 1fr;
      }

      .article-card {
        grid-template-columns: 1fr;
      }

      .score-stack {
        width: 100%;
      }

      .reader-article {
        padding: 18px;
      }

      .reader-article h1 {
        font-size: 27px;
      }

      .content {
        padding: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="主导航" data-i18n-aria-label="sidebar.aria">
      <div class="brand">
        <div class="brand-mark"><i class="ti ti-link" aria-hidden="true"></i></div>
        <div class="brand-title">
          <strong>HyperReader</strong>
          <span data-i18n="brand.subtitle">开放链接阅读工作台</span>
        </div>
      </div>

      <nav class="nav-block">
        <div class="nav-label" data-i18n="nav.workspace">工作区</div>
        <button class="nav-item active" data-view="queue" onclick="showView('queue')">
          <i class="ti ti-list-search" aria-hidden="true"></i><span data-i18n="nav.queue">阅读队列</span><span class="count" id="navQueueCount">0</span>
        </button>
        <button class="nav-item" data-view="reader" onclick="showReader(state.selectedId)">
          <i class="ti ti-book-2" aria-hidden="true"></i><span data-i18n="nav.reader">深读室</span><span class="count" id="navSavedCount">0</span>
        </button>
        <button class="nav-item" data-view="graph" onclick="showView('graph')">
          <i class="ti ti-chart-dots-3" aria-hidden="true"></i><span data-i18n="nav.graph">外链图谱</span><span class="count" id="navGraphCount">0</span>
        </button>
        <button class="nav-item" data-view="diagnose" onclick="showView('diagnose')">
          <i class="ti ti-stethoscope" aria-hidden="true"></i><span data-i18n="nav.diagnose">文本诊断</span><span class="count" data-i18n="nav.local">本地</span>
        </button>
        <button class="nav-item" data-view="trail" onclick="showView('trail')">
          <i class="ti ti-route" aria-hidden="true"></i><span data-i18n="nav.trail">阅读路径</span><span class="count" id="navTrailCount">0</span>
        </button>
        <button class="nav-item" data-view="sources" onclick="showView('sources')">
          <i class="ti ti-antenna-bars-5" aria-hidden="true"></i><span data-i18n="nav.sources">来源库</span><span class="count" id="navSourceCount">0</span>
        </button>
      </nav>

      <section class="source-strip" id="sourceStrip" aria-label="来源开放度" data-i18n-aria-label="sourceStrip.aria"></section>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-menu" onclick="toggleMenu()" title="导航" data-i18n-title="mobileMenu.title">
          <i class="ti ti-menu-2" aria-hidden="true"></i>
        </button>
        <label class="search">
          <i class="ti ti-search" aria-hidden="true"></i>
          <input id="searchInput" type="search" placeholder="搜索标题、来源、标签、链接域名" data-i18n-placeholder="search.placeholder" oninput="handleSearch(this.value)">
        </label>
        <div class="toolbar">
          <label class="locale-select">
            <i class="ti ti-language" aria-hidden="true"></i>
            <select id="localeSelect" aria-label="语言" data-i18n-aria-label="locale.label" onchange="setLocale(this.value)">
              <option value="zh-Hans">简体中文</option>
              <option value="zh-Hant">繁體中文</option>
              <option value="en">English</option>
              <option value="ms">Malay</option>
            </select>
          </label>
          <button class="btn" onclick="showView('diagnose')"><i class="ti ti-scan" aria-hidden="true"></i><span data-i18n="topbar.diagnose">诊断文本</span></button>
          <button class="btn primary" onclick="showQuickAdd()"><i class="ti ti-plus" aria-hidden="true"></i><span data-i18n="topbar.add">添加链接</span></button>
        </div>
      </header>

      <section class="content">
        <section class="view active" id="view-queue">
          <div class="metric-grid" id="metrics"></div>
          <div class="split">
            <section class="panel">
              <div class="panel-head">
                <div>
                  <h2 data-i18n="queue.title">去算法阅读队列</h2>
                  <small id="queueSubtitle">按开放度和关联主题排序</small>
                </div>
                <div class="toolbar">
                  <button class="chip on" data-filter="all" onclick="setFilter('all')"><i class="ti ti-stack-2" aria-hidden="true"></i><span data-i18n="filter.all">全部</span></button>
                  <button class="chip" data-filter="open" onclick="setFilter('open')"><i class="ti ti-world" aria-hidden="true"></i><span data-i18n="filter.open">高开放</span></button>
                  <button class="chip" data-filter="needs-links" onclick="setFilter('needs-links')"><i class="ti ti-link-off" aria-hidden="true"></i><span data-i18n="filter.needsLinks">待补链</span></button>
                  <button class="chip" data-filter="counter" onclick="setFilter('counter')"><i class="ti ti-arrows-left-right" aria-hidden="true"></i><span data-i18n="filter.counter">反方观点</span></button>
                  <button class="chip" data-filter="saved" onclick="setFilter('saved')"><i class="ti ti-bookmark" aria-hidden="true"></i><span data-i18n="filter.saved">已保存</span></button>
                </div>
              </div>
              <div class="panel-body">
                <div class="feed" id="feed"></div>
              </div>
            </section>

            <aside class="side-stack">
              <section class="panel">
                <div class="panel-head">
                  <h3 data-i18n="focus.title">今日读法</h3>
                  <button class="icon-btn" onclick="reshuffleFocus()" title="换一组" data-i18n-title="focus.shuffleTitle"><i class="ti ti-refresh" aria-hidden="true"></i></button>
                </div>
                <div class="panel-body" id="focusPanel"></div>
              </section>
              <section class="panel">
                <div class="panel-head">
                  <h3 data-i18n="zero.title">零点击警戒</h3>
                  <button class="icon-btn" onclick="showView('diagnose')" title="诊断" data-i18n-title="diagnose.shortTitle"><i class="ti ti-arrow-right" aria-hidden="true"></i></button>
                </div>
                <div class="panel-body" id="zeroClickPanel"></div>
              </section>
            </aside>
          </div>
        </section>

        <section class="view" id="view-reader">
          <div class="reader-layout">
            <article class="panel reader-article" id="readerArticle"></article>
            <aside class="side-stack">
              <section class="panel">
                <div class="panel-head">
                  <h3 data-i18n="reader.radar">开放性雷达</h3>
                  <button class="icon-btn" onclick="saveSelected()" title="保存" data-i18n-title="action.save"><i class="ti ti-bookmark" aria-hidden="true"></i></button>
                </div>
                <div class="panel-body">
                  <div class="score-list" id="readerScores"></div>
                </div>
              </section>
              <section class="panel">
                <div class="panel-head">
                  <h3 data-i18n="reader.linkList">外链清单</h3>
                  <button class="icon-btn" onclick="copyLinkBundle()" title="复制清单" data-i18n-title="action.copyBundle"><i class="ti ti-copy" aria-hidden="true"></i></button>
                </div>
                <div class="panel-body">
                  <div class="link-list" id="readerLinks"></div>
                </div>
              </section>
              <section class="panel">
                <div class="panel-head">
                  <h3 data-i18n="reader.next">下一跳</h3>
                  <button class="icon-btn" onclick="buildTrailFromSelected()" title="生成路径" data-i18n-title="action.buildTrail"><i class="ti ti-route" aria-hidden="true"></i></button>
                </div>
                <div class="panel-body" id="nextLinks"></div>
              </section>
            </aside>
          </div>
        </section>

        <section class="view" id="view-graph">
          <section class="panel graph-shell">
            <canvas id="linkCanvas" aria-label="外链网络图" data-i18n-aria-label="graph.aria"></canvas>
            <div class="graph-tip" id="graphTip"></div>
            <div class="legend">
              <span><i class="ti ti-circle-filled" style="color: var(--green)" aria-hidden="true"></i><span data-i18n="graph.legend.blog">独立站与博客</span></span>
              <span><i class="ti ti-circle-filled" style="color: var(--blue)" aria-hidden="true"></i><span data-i18n="graph.legend.news">媒体与公共资料</span></span>
              <span><i class="ti ti-circle-filled" style="color: var(--rust)" aria-hidden="true"></i><span data-i18n="graph.legend.research">研究与档案</span></span>
              <span><i class="ti ti-line" aria-hidden="true"></i><span data-i18n="graph.legend.relation">引用与议题关系</span></span>
            </div>
          </section>
        </section>

        <section class="view" id="view-diagnose">
          <div class="split">
            <section class="panel">
              <div class="panel-head">
                <div>
                  <h2 data-i18n="diagnose.title">文本与 URL 诊断</h2>
                  <small data-i18n="diagnose.subtitle">本地启发式分析</small>
                </div>
                <button class="btn green" onclick="runDiagnosis()"><i class="ti ti-activity" aria-hidden="true"></i><span data-i18n="diagnose.run">开始诊断</span></button>
              </div>
              <div class="panel-body">
                <div class="form-grid">
                  <label class="field full">
                    <span data-i18n="diagnose.inputLabel">内容或链接</span>
                    <textarea id="diagnosisInput" placeholder="粘贴一段帖子、新闻摘要、AI Overview、搜索结果或 URL" data-i18n-placeholder="diagnose.inputPlaceholder"></textarea>
                  </label>
                  <label class="field">
                    <span data-i18n="diagnose.modeLabel">阅读场景</span>
                    <select id="diagnosisMode">
                      <option value="feed" data-i18n="diagnose.mode.feed">社交媒体资讯流</option>
                      <option value="search" data-i18n="diagnose.mode.search">搜索结果或 AI 摘要</option>
                      <option value="article" data-i18n="diagnose.mode.article">长文或报道</option>
                      <option value="chat" data-i18n="diagnose.mode.chat">群聊转发</option>
                    </select>
                  </label>
                  <label class="field">
                    <span data-i18n="diagnose.goalLabel">目标</span>
                    <select id="diagnosisGoal">
                      <option value="verify" data-i18n="diagnose.goal.verify">查证事实</option>
                      <option value="understand" data-i18n="diagnose.goal.understand">理解议题</option>
                      <option value="debate" data-i18n="diagnose.goal.debate">准备讨论</option>
                      <option value="archive" data-i18n="diagnose.goal.archive">整理资料</option>
                    </select>
                  </label>
                </div>
              </div>
            </section>

            <aside class="side-stack">
              <section class="panel">
                <div class="panel-head">
                  <h3 data-i18n="diagnose.resultTitle">诊断结果</h3>
                  <button class="icon-btn" onclick="copyDiagnosis()" title="复制" data-i18n-title="action.copy"><i class="ti ti-copy" aria-hidden="true"></i></button>
                </div>
                <div class="panel-body result-grid" id="diagnosisResult"></div>
              </section>
            </aside>
          </div>
        </section>

        <section class="view" id="view-trail">
          <div class="split">
            <section class="panel">
              <div class="panel-head">
                <div>
                  <h2 data-i18n="trail.title">七步阅读路径</h2>
                  <small id="trailSeedLabel">从当前选中文章生成</small>
                </div>
                <div class="toolbar">
                  <button class="btn" onclick="buildTrailFromSelected()"><i class="ti ti-route" aria-hidden="true"></i><span data-i18n="trail.generate">生成</span></button>
                  <button class="btn primary" onclick="copyTrailMarkdown()"><i class="ti ti-markdown" aria-hidden="true"></i><span data-i18n="trail.copyMarkdown">复制 Markdown</span></button>
                </div>
              </div>
              <div class="panel-body">
                <div class="trail-list" id="trailList"></div>
              </div>
            </section>

            <aside class="side-stack">
              <section class="panel">
                <div class="panel-head">
                  <h3 data-i18n="trail.params">路径参数</h3>
                  <button class="icon-btn" onclick="showQuickAdd()" title="添加" data-i18n-title="action.add"><i class="ti ti-plus" aria-hidden="true"></i></button>
                </div>
                <div class="panel-body">
                  <div class="form-grid">
                    <label class="field full">
                      <span data-i18n="trail.topicLabel">议题焦点</span>
                      <input id="trailTopic" type="text" placeholder="例如：开放互联网、AI 摘要、公共领域" data-i18n-placeholder="trail.topicPlaceholder">
                    </label>
                    <label class="field">
                      <span data-i18n="trail.intensityLabel">路径强度</span>
                      <select id="trailIntensity">
                        <option value="normal" data-i18n="trail.intensity.normal">标准</option>
                        <option value="deep" data-i18n="trail.intensity.deep">深读</option>
                        <option value="action" data-i18n="trail.intensity.action">行动</option>
                      </select>
                    </label>
                    <label class="field">
                      <span data-i18n="trail.preferenceLabel">偏好来源</span>
                      <select id="trailPreference">
                        <option value="mixed" data-i18n="trail.preference.mixed">混合来源</option>
                        <option value="primary" data-i18n="trail.preference.primary">原始资料优先</option>
                        <option value="counter" data-i18n="trail.preference.counter">反方观点优先</option>
                        <option value="local" data-i18n="trail.preference.local">本地社区优先</option>
                      </select>
                    </label>
                  </div>
                </div>
              </section>
            </aside>
          </div>
        </section>

        <section class="view" id="view-sources">
          <div class="split">
            <section class="panel">
              <div class="panel-head">
                <div>
                  <h2 data-i18n="sources.title">来源库</h2>
                  <small data-i18n="sources.subtitle">RSS、独立站、档案、公共资料</small>
                </div>
                <div class="toolbar">
                  <button class="btn" onclick="exportData()"><i class="ti ti-download" aria-hidden="true"></i><span data-i18n="sources.export">导出</span></button>
                  <button class="btn primary" onclick="showQuickAdd()"><i class="ti ti-plus" aria-hidden="true"></i><span data-i18n="sources.add">添加</span></button>
                </div>
              </div>
              <div class="panel-body">
                <div class="source-grid" id="sourceGrid"></div>
              </div>
            </section>

            <aside class="side-stack">
              <section class="panel">
                <div class="panel-head">
                  <h3 data-i18n="add.title">添加链接或来源</h3>
                  <button class="icon-btn" onclick="resetQuickAdd()" title="清空" data-i18n-title="action.clear"><i class="ti ti-eraser" aria-hidden="true"></i></button>
                </div>
                <div class="panel-body">
                  <div class="form-grid">
                    <label class="field full">
                      <span data-i18n="add.titleLabel">标题</span>
                      <input id="addTitle" type="text" placeholder="文章、RSS 或资料库名称" data-i18n-placeholder="add.titlePlaceholder">
                    </label>
                    <label class="field full">
                      <span>URL</span>
                      <input id="addUrl" type="url" placeholder="https://">
                    </label>
                    <label class="field">
                      <span data-i18n="add.typeLabel">类型</span>
                      <select id="addType">
                        <option value="blog" data-i18n="sourceType.blog">独立站</option>
                        <option value="news" data-i18n="sourceType.news">媒体</option>
                        <option value="research" data-i18n="sourceType.research">研究</option>
                        <option value="archive" data-i18n="sourceType.archive">档案</option>
                        <option value="community" data-i18n="sourceType.community">社区</option>
                      </select>
                    </label>
                    <label class="field">
                      <span data-i18n="add.linksLabel">外链数</span>
                      <input id="addLinks" type="number" min="0" max="120" value="3">
                    </label>
                    <label class="field full">
                      <span data-i18n="add.summaryLabel">摘要</span>
                      <textarea id="addSummary" placeholder="此来源提供什么视角？它把读者导向哪里？" data-i18n-placeholder="add.summaryPlaceholder"></textarea>
                    </label>
                    <button class="btn green" style="grid-column: 1 / -1" onclick="addItem()">
                      <i class="ti ti-check" aria-hidden="true"></i><span data-i18n="add.submit">加入阅读队列</span>
                    </button>
                  </div>
                </div>
              </section>
            </aside>
          </div>
        </section>
      </section>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script>

        summary: "动员不只靠热度，也靠可引用、可复盘、可传承的资料结构。",
        body: [

    ];

    const saved = loadState();
    const state = {
      view: "queue",
      filter: "all",
      query: "",
      locale: saved.locale || "zh-Hans",
      selectedId: saved.selectedId || seedItems[0].id,
      focusIndex: saved.focusIndex || 0,
      sources: saved.sources || seedSources,
      items: saved.items || seedItems,
      trail: saved.trail || [],
      trailLocale: saved.trailLocale || null,
      lastDiagnosis: saved.lastDiagnosis || null
    };

    function t(key, params = {}) {
      const locale = translations[state.locale] ? state.locale : "zh-Hans";
      const value = translations[locale][key] ?? translations["zh-Hans"][key] ?? key;
      return String(value).replace(/\{(\w+)\}/g, (_, name) => params[name] ?? "");
    }

    function applyLocale() {
      if (!translations[state.locale]) state.locale = "zh-Hans";
      document.documentElement.lang = state.locale;
      document.title = t("app.title");
      byId("localeSelect").value = state.locale;
      document.querySelectorAll("[data-i18n]").forEach(node => {
        node.textContent = t(node.dataset.i18n);
      });
      document.querySelectorAll("[data-i18n-placeholder]").forEach(node => {
        node.setAttribute("placeholder", t(node.dataset.i18nPlaceholder));
      });
      document.querySelectorAll("[data-i18n-title]").forEach(node => {
        node.setAttribute("title", t(node.dataset.i18nTitle));
      });
      document.querySelectorAll("[data-i18n-aria-label]").forEach(node => {
        node.setAttribute("aria-label", t(node.dataset.i18nAriaLabel));
      });
    }

    function setLocale(locale) {
      if (!translations[locale]) return;
      state.locale = locale;
      persist();
      renderAll();
    }

    function loadState() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
      } catch (error) {
        return {};
      }
    }

    function persist() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        locale: state.locale,
        selectedId: state.selectedId,
        focusIndex: state.focusIndex,
        sources: state.sources,
        items: state.items,
        trail: state.trail,
        trailLocale: state.trailLocale,
        lastDiagnosis: state.lastDiagnosis
      }));
    }

    function byId(id) {
      return document.getElementById(id);
    }

    function currentItem() {
      return state.items.find(item => item.id === state.selectedId) || state.items[0];
    }

    function score(item) {
      const linkScore = Math.min(100, Math.round(item.links * 4.2));
      return Math.round((linkScore + item.diversity + item.primary + item.contrast + item.independence) / 5);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function domainFromUrl(url) {
      try {
        return new URL(url).hostname.replace(/^www\./, "");
      } catch (error) {
        return String(url || "").replace(/^https?:\/\//, "").split("/")[0] || "manual.local";
      }
    }

    function saveAndRender() {
      persist();
      renderAll();
    }

    function renderAll() {
      applyLocale();
      renderNav();
      renderMetrics();
      renderFeed();
      renderReader();
      renderSources();
      renderSourceStrip();
      renderFocus();
      renderZeroClick();
      renderTrail();
      if (state.lastDiagnosis) {
        renderDiagnosis(state.lastDiagnosis);
      } else {
        byId("diagnosisResult").innerHTML = `<div class="empty">${t("diagnose.waiting")}</div>`;
      }
      if (state.view === "graph") {
        requestAnimationFrame(drawGraph);
      }
    }

    function renderNav() {
      document.querySelectorAll(".nav-item").forEach(item => {
        item.classList.toggle("active", item.dataset.view === state.view);
      });
      byId("navQueueCount").textContent = state.items.length;
      byId("navSavedCount").textContent = state.items.filter(item => item.saved).length;
      byId("navGraphCount").textContent = state.items.reduce((sum, item) => sum + item.outlinks.length, 0);
      byId("navTrailCount").textContent = state.trail.length || 7;
      byId("navSourceCount").textContent = state.sources.filter(source => source.active).length;
    }

    function renderMetrics() {
      const items = state.items;
      const avgOpen = Math.round(items.reduce((sum, item) => sum + score(item), 0) / Math.max(1, items.length));
      const totalLinks = items.reduce((sum, item) => sum + item.outlinks.length, 0);
      const needsLinks = items.filter(item => item.links < 8 || item.primary < 45).length;
      const savedCount = items.filter(item => item.saved).length;
      const metrics = [
        [t("metric.openIndex"), avgOpen, t("metric.openDetail")],
        [t("metric.outlinks"), totalLinks, t("metric.outlinksDetail")],
        [t("metric.needsLinks"), needsLinks, t("metric.needsLinksDetail")],
        [t("metric.saved"), savedCount, t("metric.savedDetail")]
      ];
      byId("metrics").innerHTML = metrics.map(([label, value, detail], index) => `
        <article class="metric">
          <span>${label}</span>
          <strong style="color:${[sourceColors.blog, sourceColors.news, sourceColors.research, sourceColors.archive][index]}">${value}</strong>
          <span>${detail}</span>
        </article>
      `).join("");
    }

    function renderFeed() {
      const query = state.query.trim().toLowerCase();
      const filtered = state.items
        .filter(item => {
          if (state.filter === "open") return score(item) >= 74;
          if (state.filter === "needs-links") return item.links < 8 || item.primary < 45 || item.stance === "needs-links";
          if (state.filter === "counter") return item.stance === "counter" || item.contrast >= 64;
          if (state.filter === "saved") return item.saved;
          return true;
        })
        .filter(item => {
          if (!query) return true;
          const haystack = [
            item.title,
            item.source,
            item.domain,
            item.summary,
            item.tags.join(" "),
            item.outlinks.map(link => link.domain).join(" ")
          ].join(" ").toLowerCase();
          return haystack.includes(query);
        })
        .sort((a, b) => score(b) - score(a));

      byId("queueSubtitle").textContent = t("queue.subtitle", { filtered: filtered.length, total: state.items.length });
      byId("feed").innerHTML = filtered.length ? filtered.map(articleCard).join("") : `<div class="empty">${t("queue.empty")}</div>`;
    }

    function articleCard(item) {
      const itemScore = score(item);
      const tagClass = itemScore > 75 ? "green" : itemScore < 52 ? "rust" : "blue";
      return `
        <article class="article-card ${item.id === state.selectedId ? "selected" : ""}" onclick="showReader('${item.id}')">
          <div>
            <div class="meta">
              <span class="dot" style="background:${sourceColors[item.type] || sourceColors.blog}"></span>
              <span>${escapeHtml(item.source)}</span>
              <span>${escapeHtml(item.domain)}</span>
              <span>${escapeHtml(item.date)}</span>
            </div>
            <h3 class="article-title">${escapeHtml(item.title)}</h3>
            <p class="summary">${escapeHtml(item.summary)}</p>
            <div class="tag-row">
              <span class="tag ${tagClass}">${t("tag.open", { score: itemScore })}</span>
              <span class="tag">${t("tag.outlinks", { count: item.links })}</span>
              ${item.tags.slice(0, 3).map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join("")}
            </div>
          </div>
          <div class="score-stack">
            ${miniScore(t("mini.links"), Math.min(100, item.links * 4.2), sourceColors.blog)}
            ${miniScore(t("mini.evidence"), item.primary, sourceColors.research)}
            ${miniScore(t("mini.counter"), item.contrast, sourceColors.news)}
            <div class="toolbar" onclick="event.stopPropagation()">
              <button class="icon-btn" onclick="toggleSave('${item.id}')" title="${item.saved ? t("action.unsave") : t("action.save")}">
                <i class="ti ${item.saved ? "ti-bookmark-filled" : "ti-bookmark"}" aria-hidden="true"></i>
              </button>
              <button class="icon-btn" onclick="buildTrail('${item.id}')" title="${t("action.buildTrail")}">
                <i class="ti ti-route" aria-hidden="true"></i>
              </button>
            </div>
          </div>
        </article>
      `;
    }

    function miniScore(label, value, color) {
      const pct = Math.max(0, Math.min(100, Math.round(value)));
      return `
        <div class="mini-score">
          <span><em>${label}</em><em>${pct}</em></span>
          <div class="bar"><b style="width:${pct}%;background:${color}"></b></div>
        </div>
      `;
    }

    function renderReader() {
      const item = currentItem();
      if (!item) {
        byId("readerArticle").innerHTML = `<div class="empty">${t("reader.empty")}</div>`;
        return;
      }
      byId("readerArticle").innerHTML = `
        <div class="meta">
          <span class="dot" style="background:${sourceColors[item.type] || sourceColors.blog}"></span>
          <span>${escapeHtml(item.source)}</span>
          <span>${escapeHtml(item.domain)}</span>
          <span>${escapeHtml(item.date)}</span>
        </div>
        <h1>${escapeHtml(item.title)}</h1>
        <p class="lead">${escapeHtml(item.summary)}</p>
        ${item.body.map(paragraph => `<p>${escapeHtml(paragraph)}</p>`).join("")}
        <div class="tag-row">
          ${item.tags.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join("")}
        </div>
      `;

      const scoreRows = [
        [t("score.link"), Math.min(100, item.links * 4.2), sourceColors.blog],
        [t("score.diversity"), item.diversity, sourceColors.news],
        [t("score.primary"), item.primary, sourceColors.research],
        [t("score.contrast"), item.contrast, sourceColors.archive],
        [t("score.independence"), item.independence, sourceColors.community]
      ];
      byId("readerScores").innerHTML = scoreRows.map(([label, value, color]) => `
        <div class="score-row">
          <label><span>${label}</span><b>${Math.round(value)}</b></label>
          <div class="bar"><b style="width:${Math.min(100, value)}%;background:${color}"></b></div>
        </div>
      `).join("");

      byId("readerLinks").innerHTML = item.outlinks.length ? item.outlinks.map(link => `
        <a class="link-item" href="${escapeHtml(link.url)}" target="_blank" rel="noreferrer">
          <i class="ti ti-external-link" aria-hidden="true"></i>
          <span><strong>${escapeHtml(link.label)}</strong><span>${escapeHtml(link.domain)}</span></span>
        </a>
      `).join("") : `<div class="empty">${t("reader.noOutlinks")}</div>`;

      const related = state.items
        .filter(other => other.id !== item.id && other.tags.some(tag => item.tags.includes(tag)))
        .slice(0, 4);
      byId("nextLinks").innerHTML = related.length ? `
        <div class="link-list">
          ${related.map(other => `
            <button class="link-item" onclick="showReader('${other.id}')" style="text-align:left">
              <i class="ti ti-arrow-up-right" aria-hidden="true"></i>
              <span><strong>${escapeHtml(other.title)}</strong><span>${escapeHtml(other.tags.join(" / "))}</span></span>
            </button>
          `).join("")}
        </div>
      ` : `<div class="empty">${t("reader.noRelated")}</div>`;
    }

    function renderSourceStrip() {
      const activeSources = state.sources.filter(source => source.active);
      byId("sourceStrip").innerHTML = activeSources.map(source => `
        <div class="source-row">
          <span class="dot" style="background:${sourceColors[source.type] || sourceColors.blog}"></span>
          <span>${escapeHtml(source.name)}</span>
          <strong>${source.openness}</strong>
        </div>
      `).join("");
    }

    function renderFocus() {
      const ordered = [...state.items].sort((a, b) => b.contrast + b.primary - (a.contrast + a.primary));
      const focus = ordered[state.focusIndex % ordered.length];
      if (!focus) return;
      const second = ordered[(state.focusIndex + 2) % ordered.length] || focus;
      byId("focusPanel").innerHTML = `
        <div class="link-list">
          <button class="link-item" onclick="showReader('${focus.id}')" style="text-align:left">
            <i class="ti ti-book" aria-hidden="true"></i>
            <span><strong>${escapeHtml(focus.title)}</strong><span>${t("focus.first")}</span></span>
          </button>
          <button class="link-item" onclick="showReader('${second.id}')" style="text-align:left">
            <i class="ti ti-arrows-left-right" aria-hidden="true"></i>
            <span><strong>${escapeHtml(second.title)}</strong><span>${t("focus.second")}</span></span>
          </button>
          <button class="link-item" onclick="buildTrail('${focus.id}')" style="text-align:left">
            <i class="ti ti-route" aria-hidden="true"></i>
            <span><strong>${t("focus.build")}</strong><span>${t("focus.buildDetail")}</span></span>
          </button>
        </div>
      `;
    }

    function renderZeroClick() {
      const risky = state.items.filter(item => item.links < 8 || item.primary < 45);
      const top = risky[0] || state.items[0];
      byId("zeroClickPanel").innerHTML = `
        <div class="diagnosis">
          <div class="diagnosis-cell">
            <span>${t("zero.riskyNodes")}</span>
            <strong style="color:${sourceColors.research}">${risky.length}</strong>
            <span>${t("zero.missingSources")}</span>
          </div>
          <div class="diagnosis-cell">
            <span>${t("zero.needsLinks")}</span>
            <strong style="color:${sourceColors.news}">${top ? top.links : 0}</strong>
            <span>${top ? escapeHtml(top.title.slice(0, 12)) : t("zero.none")}</span>
          </div>
          <div class="diagnosis-cell">
            <span>${t("zero.suggestedAction")}</span>
            <strong style="color:${sourceColors.blog}">3</strong>
            <span>${t("zero.actionKinds")}</span>
          </div>
        </div>
      `;
    }

    function renderSources() {
      byId("sourceGrid").innerHTML = state.sources.map(source => `
        <article class="source-card">
          <header>
            <span class="dot" style="background:${sourceColors[source.type] || sourceColors.blog}"></span>
            <h3>${escapeHtml(source.name)}</h3>
            <button class="toggle ${source.active ? "on" : ""}" onclick="toggleSource('${source.id}')" aria-label="${t("source.toggleAria")}"></button>
          </header>
          <p>${escapeHtml(source.url)}</p>
          <div class="score-row">
            <label><span>${t("source.openness")}</span><b>${source.openness}</b></label>
            <div class="bar"><b style="width:${source.openness}%;background:${sourceColors[source.type] || sourceColors.blog}"></b></div>
          </div>
          <p>${escapeHtml(source.note)}</p>
        </article>
      `).join("");
    }

    function renderTrail() {
      if (!state.trail.length || state.trailLocale !== state.locale) {
        buildTrail(state.selectedId, false);
      }
      const seed = currentItem();
      byId("trailSeedLabel").textContent = seed ? t("trail.seedLabel", { title: seed.title }) : t("trail.seedDefault");
      byId("trailList").innerHTML = state.trail.map((step, index) => `
        <article class="trail-step">
          <b>${index + 1}</b>
          <div>
            <h3>${escapeHtml(step.title)}</h3>
            <p>${escapeHtml(step.note)}</p>
          </div>
        </article>
      `).join("");
    }

    function showView(view) {
      state.view = view;
      document.querySelectorAll(".view").forEach(node => node.classList.toggle("active", node.id === `view-${view}`));
      document.body.classList.remove("menu-open");
      renderNav();
      if (view === "graph") {
        requestAnimationFrame(drawGraph);
      }
      persist();
    }

    function showReader(id) {
      if (id) state.selectedId = id;
      const item = currentItem();
      if (item) item.read = true;
      showView("reader");
      renderReader();
      renderFeed();
      persist();
    }

    function handleSearch(value) {
      state.query = value;
      renderFeed();
    }

    function setFilter(filter) {
      state.filter = filter;
      document.querySelectorAll("[data-filter]").forEach(chip => chip.classList.toggle("on", chip.dataset.filter === filter));
      renderFeed();
      persist();
    }

    function toggleSave(id) {
      const item = state.items.find(entry => entry.id === id);
      if (!item) return;
      item.saved = !item.saved;
      toast(item.saved ? t("toast.saved") : t("toast.unsaved"));
      saveAndRender();
    }

    function saveSelected() {
      const item = currentItem();
      if (!item) return;
      item.saved = true;
      toast(t("toast.savedCurrent"));
      saveAndRender();
    }

    function reshuffleFocus() {
      state.focusIndex += 1;
      renderFocus();
      persist();
    }

    function toggleSource(id) {
      const source = state.sources.find(entry => entry.id === id);
      if (!source) return;
      source.active = !source.active;
      toast(source.active ? t("source.enabled") : t("source.paused"));
      saveAndRender();
    }

    function showQuickAdd() {
      showView("sources");
      setTimeout(() => byId("addTitle").focus(), 50);
    }

    function resetQuickAdd() {
      ["addTitle", "addUrl", "addSummary"].forEach(id => byId(id).value = "");
      byId("addLinks").value = 3;
      byId("addType").value = "blog";
    }

    function addItem() {
      const title = byId("addTitle").value.trim();
      const url = byId("addUrl").value.trim();
      const summary = byId("addSummary").value.trim();
      const type = byId("addType").value;
      const links = Number(byId("addLinks").value || 0);
      if (!title || !url) {
        toast(t("add.toast.missing"));
        return;
      }
      const domain = domainFromUrl(url);
      const id = `manual-${Date.now()}`;
      const item = {
        id,
        title,
        source: t("add.sourceName"),
        domain,
        type,
        date: new Date().toISOString().slice(0, 10),
        links,
        diversity: Math.min(92, 38 + links * 5),
        primary: Math.min(88, 30 + links * 6),
        contrast: Math.min(80, 28 + links * 4),
        independence: /facebook|instagram|tiktok|x\.com|youtube|wechat|weibo/i.test(domain) ? 32 : 78,
        saved: false,
        read: false,
        tags: [t("add.tag"), typeName(type)],
        stance: links < 4 ? "needs-links" : "manual",
        summary: summary || t("add.summaryDefault"),
        body: [
          summary || t("add.bodyDefault1"),
          t("add.bodyDefault2")
        ],
        outlinks: [{ label: t("add.original"), url, domain }]
      };
      state.items.unshift(item);
      state.selectedId = id;
      if (!state.sources.some(source => source.url === url || source.name === domain)) {
        state.sources.push({
          id: `source-${Date.now()}`,
          name: domain,
          type,
          url,
          active: true,
          openness: score(item),
          note: summary || t("add.sourceNoteDefault")
        });
      }
      resetQuickAdd();
      toast(t("add.toast.added"));
      saveAndRender();
      showReader(id);
    }

    function typeName(type) {
      return {
        blog: t("sourceType.blog"),
        news: t("sourceType.news"),
        research: t("sourceType.research"),
        archive: t("sourceType.archive"),
        community: t("sourceType.community")
      }[type] || t("sourceType.fallback");
    }

    function runDiagnosis() {
      const input = byId("diagnosisInput").value.trim();
      if (!input) {
        toast(t("diagnose.toast.empty"));
        return;
      }
      const urls = input.match(/https?:\/\/[^\s，。！？)）]+/g) || [];
      const domains = [...new Set(urls.map(domainFromUrl))];
      const sentences = input
        .split(/[。！？!?;\n]/)
        .map(sentence => sentence.trim())
        .filter(sentence => sentence.length > 10)
        .slice(0, 8);
      const hypeWords = ["震惊", "內幕", "内幕", "所有人", "绝对", "絕對", "彻底", "徹底", "唯一", "马上", "馬上", "不得不", "惊天", "驚天", "反转", "反轉", "必看", "封杀", "封殺", "shocking", "exclusive", "must see", "everyone", "absolute", "right now", "tergempar", "eksklusif", "wajib baca"];
      const vagueWords = ["据说", "據說", "有人指出", "专家表示", "專家表示", "网传", "網傳", "消息称", "消息稱", "内部人士", "內部人士", "研究显示", "研究顯示", "大家都知道", "experts say", "sources say", "it is said", "reportedly", "viral claim", "pakar berkata", "sumber berkata", "dikatakan", "menurut sumber"];
      const platformWords = ["小铃铛", "小鈴鐺", "关注", "關注", "带货", "帶貨", "爆款", "流量", "算法推荐", "演算法推薦", "种草", "種草", "转发", "轉發", "subscribe", "like and share", "viral", "algorithm recommends", "follow", "ikuti", "kongsi", "viral", "algoritma mencadangkan"];
      const hypeCount = hypeWords.filter(word => input.includes(word)).length;
      const vagueCount = vagueWords.filter(word => input.includes(word)).length;
      const platformCount = platformWords.filter(word => input.includes(word)).length;
      const linkDensity = Math.min(100, Math.round((urls.length / Math.max(1, sentences.length)) * 100));
      const sourceDiversity = Math.min(100, domains.length * 25);
      const slopRisk = Math.max(0, Math.min(100, 42 + hypeCount * 11 + vagueCount * 12 + platformCount * 8 - urls.length * 8 - domains.length * 6));
      const zeroClickRisk = Math.max(0, Math.min(100, 72 - urls.length * 12 - domains.length * 8 + vagueCount * 8));
      const openScore = Math.max(0, Math.min(100, 100 - Math.round((slopRisk + zeroClickRisk) / 2) + Math.round((linkDensity + sourceDiversity) / 5)));
      const claims = sentences.map(sentence => ({
        text: sentence,
        need: classifyClaim(sentence, urls.length, vagueWords)
      }));
      const mode = byId("diagnosisMode").value;
      const goal = byId("diagnosisGoal").value;
      state.lastDiagnosis = {
        openScore,
        slopRisk,
        zeroClickRisk,
        linkDensity,
        sourceDiversity,
        domains,
        claims,
        urls,
        mode,
        goal,
        actions: buildDiagnosisActions({ urls, domains, hypeCount, vagueCount, platformCount, mode, goal })
      };
      renderDiagnosis(state.lastDiagnosis);
      persist();
    }

    function classifyClaim(sentence, urlCount, vagueWords) {
      const lower = sentence.toLowerCase();
      if (vagueWords.some(word => lower.includes(word.toLowerCase()))) return t("diagnose.need.source");
      if (/数据|數據|比例|增长|增長|下降|研究|报告|報告|调查|調查|统计|統計|data|percent|study|report|survey|statistic|kajian|laporan|tinjauan|statistik/i.test(sentence)) return t("diagnose.need.data");
      if (/应该|應該|必须|必須|不能|未来|未來|将会|將會|导致|導致|证明|證明|should|must|cannot|future|will|cause|prove|patut|mesti|tidak boleh|masa depan|akan|menyebabkan|membuktikan/i.test(sentence)) return t("diagnose.need.counter");
      if (urlCount === 0) return t("diagnose.need.links");
      return t("diagnose.need.crossRead");
    }

    function buildDiagnosisActions(context) {
      const actions = [];
      if (!context.urls.length) actions.push(t("diagnose.action.addLinks"));
      if (context.domains.length < 2) actions.push(t("diagnose.action.secondDomain"));
      if (context.vagueCount) actions.push(t("diagnose.action.replaceVague"));
      if (context.hypeCount || context.platformCount) actions.push(t("diagnose.action.trimHype"));
      if (context.mode === "search") actions.push(t("diagnose.action.openOriginal"));
      if (context.goal === "debate") actions.push(t("diagnose.action.counter"));
      if (!actions.length) actions.push(t("diagnose.action.archive"));
      return actions;
    }

    function renderDiagnosis(result) {
      const claimHtml = result.claims.length ? result.claims.map(claim => `
        <div class="claim">
          <div>
            <p>${escapeHtml(claim.text)}</p>
            <em>${escapeHtml(claim.need)}</em>
          </div>
          <span class="tag rust">${t("diagnose.pendingCheck")}</span>
        </div>
      `).join("") : `<div class="empty">${t("diagnose.noClaims")}</div>`;
      byId("diagnosisResult").innerHTML = `
        <div class="diagnosis">
          <div class="diagnosis-cell">
            <span>${t("diagnose.openScore")}</span>
            <strong style="color:${sourceColors.blog}">${result.openScore}</strong>
            <span>${t("diagnose.openScoreDetail")}</span>
          </div>
          <div class="diagnosis-cell">
            <span>${t("diagnose.slopRisk")}</span>
            <strong style="color:${sourceColors.research}">${result.slopRisk}</strong>
            <span>${t("diagnose.slopRiskDetail")}</span>
          </div>
          <div class="diagnosis-cell">
            <span>${t("diagnose.zeroClickRisk")}</span>
            <strong style="color:${sourceColors.news}">${result.zeroClickRisk}</strong>
            <span>${t("diagnose.zeroClickDetail")}</span>
          </div>
        </div>
        <div class="action-box">
          <div>
            <h3>${t("diagnose.actionsTitle")}</h3>
            <small>${t("diagnose.domainCount", { count: result.domains.length })}</small>
          </div>
          <div class="link-list">
            ${result.actions.map(action => `
              <div class="link-item">
                <i class="ti ti-check" aria-hidden="true"></i>
                <span><strong>${escapeHtml(action)}</strong><span>${t("diagnose.localAdvice")}</span></span>
              </div>
            `).join("")}
          </div>
        </div>
        <div class="claim-list">${claimHtml}</div>
      `;
    }

    function buildTrailFromSelected() {
      buildTrail(state.selectedId);
    }

    function buildTrail(seedId, shouldToast = true) {
      const seed = state.items.find(item => item.id === seedId) || currentItem();
      if (!seed) return;
      const topic = byId("trailTopic")?.value.trim() || seed.tags[0] || t("trail.topicFallback");
      const all = [...state.items];
      const primary = all.find(item => item.type === "archive" || item.primary >= 85) || seed;
      const research = all.find(item => item.type === "research" && item.id !== seed.id) || primary;
      const counter = all.find(item => item.stance === "counter" || item.contrast >= 70) || seed;
      const community = all.find(item => item.type === "community") || counter;
      const weak = all.find(item => item.stance === "needs-links" || item.links < 8) || seed;
      const solution = all.find(item => item.stance === "solution") || seed;
      state.trail = [
        { title: seed.title, note: t("trail.note.seed", { topic }) },
        { title: primary.title, note: t("trail.note.primary") },
        { title: research.title, note: t("trail.note.research") },
        { title: counter.title, note: t("trail.note.counter") },
        { title: weak.title, note: t("trail.note.weak") },
        { title: community.title, note: t("trail.note.community") },
        { title: solution.title, note: t("trail.note.solution") }
      ];
      state.trailLocale = state.locale;
      byId("trailSeedLabel").textContent = t("trail.seedLabel", { title: seed.title });
      persist();
      if (shouldToast) {
        showView("trail");
        renderTrail();
        toast(t("trail.toast.built"));
      }
    }

    function copyTrailMarkdown() {
      const text = state.trail.map((step, index) => `${index + 1}. ${step.title}\n   ${step.note}`).join("\n");
      copyText(`# ${t("copy.trailTitle")}\n\n${text}`);
    }

    function copyLinkBundle() {
      const item = currentItem();
      if (!item) return;
      const links = item.outlinks.map(link => `- ${link.label}: ${link.url}`).join("\n") || `- ${t("copy.pendingOutlink")}`;
      copyText(`# ${item.title}\n\n${item.summary}\n\n${links}`);
    }

    function copyDiagnosis() {
      if (!state.lastDiagnosis) {
        toast(t("diagnose.toast.noResult"));
        return;
      }
      const result = state.lastDiagnosis;
      const text = [
        t("copy.diagnosisOpenScore", { score: result.openScore }),
        t("copy.diagnosisSlopRisk", { score: result.slopRisk }),
        t("copy.diagnosisZeroRisk", { score: result.zeroClickRisk }),
        "",
        t("copy.diagnosisActions"),
        ...result.actions.map(action => `- ${action}`)
      ].join("\n");
      copyText(text);
    }

    function copyText(text) {
      navigator.clipboard?.writeText(text)
        .then(() => toast(t("toast.copied")))
        .catch(() => {
          const textarea = document.createElement("textarea");
          textarea.value = text;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand("copy");
          textarea.remove();
          toast(t("toast.copied"));
        });
    }

    function exportData() {
      const data = JSON.stringify({
        exportedAt: new Date().toISOString(),
        sources: state.sources,
        items: state.items,
        trail: state.trail
      }, null, 2);
      const blob = new Blob([data], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "hyperreader-openweb.json";
      link.click();
      URL.revokeObjectURL(url);
      toast(t("toast.exported"));
    }

    function toggleMenu() {
      document.body.classList.toggle("menu-open");
    }

    function toast(message) {
      const node = byId("toast");
      node.textContent = message;
      node.classList.add("show");
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => node.classList.remove("show"), 2200);
    }

    function drawGraph() {
      const canvas = byId("linkCanvas");
      if (!canvas) return;
      const rect = canvas.getBoundingClientRect();
      const width = Math.max(360, Math.floor(rect.width));
      const height = 560;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.height = `${height}px`;
      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, width, height);

      const nodes = state.items.map((item, index) => {
        const angle = (Math.PI * 2 * index) / state.items.length - Math.PI / 2;
        const radiusX = width * 0.34;
        const radiusY = height * 0.32;
        return {
          id: item.id,
          title: item.title,
          x: width / 2 + Math.cos(angle) * radiusX,
          y: height / 2 + Math.sin(angle) * radiusY,
          r: 12 + Math.min(20, item.links * 0.55),
          color: sourceColors[item.type] || sourceColors.blog,
          item
        };
      });

      ctx.lineWidth = 1;
      state.items.forEach((item, index) => {
        item.outlinks.forEach((link, linkIndex) => {
          const from = nodes[index];
          const targetIndex = Math.abs(hashCode(link.domain)) % nodes.length;
          const to = nodes[targetIndex];
          if (!from || !to || from === to) return;
          ctx.beginPath();
          ctx.moveTo(from.x, from.y);
          const midX = (from.x + to.x) / 2 + (linkIndex % 2 ? 26 : -26);
          const midY = (from.y + to.y) / 2 + (linkIndex % 2 ? -18 : 18);
          ctx.quadraticCurveTo(midX, midY, to.x, to.y);
          ctx.strokeStyle = "rgba(80, 72, 62, 0.22)";
          ctx.stroke();
        });
      });

      nodes.forEach(node => {
        ctx.beginPath();
        ctx.arc(node.x, node.y, node.r, 0, Math.PI * 2);
        ctx.fillStyle = `${node.color}33`;
        ctx.fill();
        ctx.lineWidth = node.id === state.selectedId ? 3 : 1.5;
        ctx.strokeStyle = node.color;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(node.x, node.y, Math.max(3, node.r * 0.32), 0, Math.PI * 2);
        ctx.fillStyle = node.color;
        ctx.fill();

        ctx.fillStyle = "#242321";
        ctx.font = "12px ui-sans-serif, system-ui, sans-serif";
        ctx.textAlign = "center";
        wrapCanvasText(ctx, node.title, node.x, node.y + node.r + 16, Math.min(150, width * 0.25), 15);
      });

      canvas.onmousemove = event => {
        const bounds = canvas.getBoundingClientRect();
        const x = event.clientX - bounds.left;
        const y = event.clientY - bounds.top;
        const hit = nodes.find(node => Math.hypot(node.x - x, node.y - y) <= node.r + 6);
        const tip = byId("graphTip");
        if (hit) {
          tip.style.display = "block";
          tip.style.left = `${Math.min(width - 270, x + 12)}px`;
          tip.style.top = `${Math.max(12, y - 36)}px`;
          tip.innerHTML = `<strong>${escapeHtml(hit.title)}</strong><br><span style="color:var(--muted)">${t("graph.tooltip", { score: score(hit.item), links: hit.item.links })}</span>`;
          canvas.style.cursor = "pointer";
        } else {
          tip.style.display = "none";
          canvas.style.cursor = "default";
        }
      };

      canvas.onclick = event => {
        const bounds = canvas.getBoundingClientRect();
        const x = event.clientX - bounds.left;
        const y = event.clientY - bounds.top;
        const hit = nodes.find(node => Math.hypot(node.x - x, node.y - y) <= node.r + 6);
        if (hit) showReader(hit.id);
      };
    }

    function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight) {
      const chars = text.split("");
      let line = "";
      let lines = [];
      chars.forEach(char => {
        const testLine = line + char;
        if (ctx.measureText(testLine).width > maxWidth && line) {
          lines.push(line);
          line = char;
        } else {
          line = testLine;
        }
      });
      lines.push(line);
      lines.slice(0, 2).forEach((entry, index) => ctx.fillText(index === 1 && lines.length > 2 ? `${entry.slice(0, -1)}…` : entry, x, y + index * lineHeight));
    }

    function hashCode(value) {
      return String(value).split("").reduce((hash, char) => ((hash << 5) - hash) + char.charCodeAt(0), 0);
    }

    window.addEventListener("resize", () => {
      if (state.view === "graph") drawGraph();
    });

    renderAll();
  </script>
</body>
</html>
